[project]
name = "datawatch"
version = "0.1.0"
description = "Windows data-usage monitor: live totals, per-app usage, daily/monthly limits with alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["psutil==7.2.2", "dissect.esedb==3.18"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pyinstaller==6.22.3"]

[project.scripts]
datawatch = "datawatch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datawatch = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
